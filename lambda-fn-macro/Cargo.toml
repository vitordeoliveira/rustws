[package]
name = "lambda-fn-macro"
version = "0.1.0"
edition = "2021"
description = "Macro for creating WASM lambda functions with minimal boilerplate"
authors = ["rustws"]

[lib]
proc-macro = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
